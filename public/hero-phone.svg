<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone Construction -->
  <rect x="20" y="20" width="360" height="760" rx="45" fill="white" stroke="#2a2a2a" stroke-width="12"/>
  <rect x="35" y="35" width="330" height="730" rx="35" fill="#F3F4F6"/>
  
  <!-- Notch -->
  <path d="M120 35H280V65C280 73.2843 273.284 80 265 80H135C126.716 80 120 73.2843 120 65V35Z" fill="#1a1a1a"/>

  <!-- Content Container -->
  <g transform="translate(35, 90)">
    <!-- Header -->
    <rect x="20" y="10" width="290" height="60" rx="15" fill="white" filter="url(#shadow)"/>
    <circle cx="50" cy="40" r="20" fill="url(#avatarGradient)"/>
    <text x="80" y="35" font-family="Arial" font-weight="bold" font-size="16" fill="#111827">Dina Pastries</text>
    <text x="80" y="55" font-family="Arial" font-size="12" fill="#6B7280">Nairobi, Kenya</text>
    
    <!-- Stats Row -->
    <g transform="translate(20, 90)">
       <rect width="140" height="70" rx="12" fill="#FAF5FF"/>
       <text x="15" y="25" font-family="Arial" font-size="10" fill="#6B21A8">VIEWS</text>
       <text x="15" y="50" font-family="Arial" font-weight="bold" font-size="24" fill="#111827">2.4k</text>
       
       <rect x="150" width="140" height="70" rx="12" fill="#F0FDF4"/>
       <text x="165" y="25" font-family="Arial" font-size="10" fill="#15803D">SALES</text>
       <text x="165" y="50" font-family="Arial" font-weight="bold" font-size="24" fill="#111827">186</text>
    </g>

    <!-- Chart -->
    <rect x="20" y="180" width="290" height="180" rx="15" fill="white" filter="url(#shadow)"/>
    <text x="40" y="210" font-family="Arial" font-weight="bold" font-size="14" fill="#111827">Weekly Growth</text>
    <!-- Bars -->
    <g transform="translate(40, 240)">
      <rect x="0" y="60" width="25" height="60" rx="4" fill="#E0E7FF"/>
      <rect x="35" y="30" width="25" height="90" rx="4" fill="#E0E7FF"/>
      <rect x="70" y="50" width="25" height="70" rx="4" fill="#E0E7FF"/>
      <rect x="105" y="20" width="25" height="100" rx="4" fill="#E0E7FF"/>
      <rect x="140" y="45" width="25" height="75" rx="4" fill="#E0E7FF"/>
      <rect x="175" y="10" width="25" height="110" rx="4" fill="#2CB34A"/>
      <rect x="210" y="40" width="25" height="80" rx="4" fill="#E0E7FF"/>
    </g>

    <!-- Recent Reviews -->
    <rect x="20" y="380" width="290" height="200" rx="15" fill="white" filter="url(#shadow)"/>
    <text x="40" y="410" font-family="Arial" font-weight="bold" font-size="14" fill="#111827">Recent Activity</text>
    
    <g transform="translate(40, 430)">
       <circle cx="15" cy="15" r="15" fill="#D1D5DB"/>
       <rect x="40" y="5" width="120" height="10" rx="5" fill="#F3F4F6"/>
       <rect x="40" y="20" width="80" height="6" rx="3" fill="#F3F4F6"/>
    </g>
    <g transform="translate(40, 480)">
       <circle cx="15" cy="15" r="15" fill="#D1D5DB"/>
       <rect x="40" y="5" width="120" height="10" rx="5" fill="#F3F4F6"/>
       <rect x="40" y="20" width="80" height="6" rx="3" fill="#F3F4F6"/>
    </g>
    <g transform="translate(40, 530)">
       <circle cx="15" cy="15" r="15" fill="#D1D5DB"/>
       <rect x="40" y="5" width="120" height="10" rx="5" fill="#F3F4F6"/>
       <rect x="40" y="20" width="80" height="6" rx="3" fill="#F3F4F6"/>
    </g>
  </g>

  <!-- Floating Cards (baked into SVG) -->
  <g transform="translate(-40, 200)">
    <rect width="200" height="60" rx="12" fill="white" filter="url(#heavyShadow)"/>
    <circle cx="30" cy="30" r="15" fill="#E0F2FE"/>
    <text x="55" y="25" font-family="Arial" font-weight="bold" font-size="10" fill="#111827">New Order!</text>
    <text x="55" y="40" font-family="Arial" font-size="8" fill="#6B7280">Just now from Nairobi</text>
  </g>

  <g transform="translate(280, 500)">
    <rect width="160" height="80" rx="12" fill="white" filter="url(#heavyShadow)"/>
    <circle cx="30" cy="40" r="15" fill="#FFF7ED"/>
    <text x="55" y="35" font-family="Arial" font-weight="bold" font-size="10" fill="#111827">Rating</text>
    <text x="55" y="55" font-family="Arial" font-weight="bold" font-size="18" fill="#F59E0B">4.8 ★</text>
  </g>

  <defs>
    <filter id="shadow" x="-4" y="-4" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <filter id="heavyShadow" x="-10" y="-10" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="avatarGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
</svg>
